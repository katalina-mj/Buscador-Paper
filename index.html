<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff2878">
  <title>Buscador de mi papelería</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">

    <form id="formulario-busqueda" class="buscador">
      <button type="submit" aria-label="Buscar">
        <span class="lupa"></span>
      </button>
      <input
      type="search"
      id="busqueda"
      aria-label="Buscar productos por nombre, marca o categoría"
      placeholder="¿Qué estás buscando?"
      autocomplete="off"
>
      >
    </form>

    <p id="estado" aria-live="polite">
      Conectando con el catálogo...
    </p>

    <section id="resultados" aria-live="polite"></section>

  </main>

  <!-- Biblioteca para interpretar el CSV -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
